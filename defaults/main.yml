---
# Variable that controls whether rolling deployment is starting or not
rolling_deploy_starting: false

# The IPv4 and IPv6 parent servers to be blocked/unblocked during rolling deployment
# The IPv4 is mandatory. The IPv6 is optional.
rolling_deploy_parent_servers_ipv4: []
rolling_deploy_parent_servers_ipv6: []

# Determine the iptables state based on whether rolling deployment is starting or not
rolling_deploy_iptables_state: "{{ 'present' if ( rolling_deploy_starting | default('false') ) else 'absent' }}"

# Block both FORWARD and INPUT chains to cover both Docker and non-Docker deployments
rolling_deploy_chains:
  - FORWARD # if docker based deployment
  - INPUT   # if non-docker based deployment or docker using host network mode

# Iptables target used to block parent servers. DROP silently discards every
# packet (new connection attempts and already-established ones alike). This
# is the default, unchanged behavior.
rolling_deploy_iptables_jump: DROP

# Optional graceful-drain grace period, in seconds. When set to a value > 0
# and rolling_deploy_starting is true, the role first blocks only NEW
# connections from the parent servers with REJECT (so already-established/
# in-flight connections are left alone and can finish naturally), waits this
# many seconds, then replaces that rule with the standard
# rolling_deploy_iptables_jump rule (DROP by default) covering all connection
# states, before returning control to the calling playbook.
#
# Default is 0 (disabled): the role behaves exactly as before, immediately
# applying rolling_deploy_iptables_jump to everything, with no graceful phase.
rolling_deploy_graceful_reject_seconds: 0

# Target and reject type used only during the graceful phase above.
rolling_deploy_graceful_reject_jump: REJECT
rolling_deploy_graceful_reject_with: tcp-reset
